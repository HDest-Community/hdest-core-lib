name: Draft New Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version you want to release.
        required: true

jobs:
  draft-new-release:
    name: Draft a New Release
    runs-on: ubuntu-slim

    steps:
      - uses: HDest-Community/.github/workflows/draft-new-release@main
        with:
          name: HDCoreLib
          version: ${{ inputs.version }}
