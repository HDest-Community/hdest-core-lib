name: CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4
      - uses: HDest-Community/.github/.github/workflows/build-pk3@main
        with:
          name: HDCoreLib
          suffix: ${{ github.ref_name }}-$(date +'%Y%m%d')
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./*.pk3
