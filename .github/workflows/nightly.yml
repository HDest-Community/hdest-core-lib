name: CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/build-pk3
        with:
          name: HDCoreLib
          suffix: ${{ github.ref_name }}-$(date +'%Y%m%d')
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./*.pk3
