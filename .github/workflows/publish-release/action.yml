name: Publish Release
description: Creates a new Release Branch, updates the CHANGELOG.md, commits, and creates a PR for review.

inputs:
  name:
    description: The base name of the PK3 being built.  For example, a mod_name of "MyCoolMod" would result in a built file named "MyCoolMod-suffix.pk3".
    required: false
    type: string
    default: ${{ github.event.repository.name }}
  branch:
    description: The branch associated with the PR.  Should start with 'release/' or 'hotfix/'.  Usually located in the `github.event.pull_request.head.ref` placeholder.
    required: true
    type: string
  target:
    description: The target commitish to create the new version tag at.  Usually located in the `github.event.pull_request.merge_commit_sha` placeholder.
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # Extract the version from the PR Branch Name
    - name: Extract version from branch name (for release branches)
      if: startsWith(inputs.branch, 'release/')
      shell:
      run: |
        BRANCH_NAME="${{ inputs.branch }}"
        VERSION=${BRANCH_NAME#release/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
    - name: Extract version from branch name (for hotfix branches)
      if: startsWith(inputs.branch, 'hotfix/')
      shell:
      run: |
        BRANCH_NAME="${{ inputs.branch }}"
        VERSION=${BRANCH_NAME#hotfix/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    # - name: Normalize PK3 Base Name
    #   if: inputs.name == github.repository
    #   shell:
    #   run: |
    #     MOD_NAME="${{ inputs.name }}"
    #     NAME=${MOD_NAME#}


    # Build & Publish PK3
    - uses: actions/checkout@v4
    # - id: build-suffix
    #   env:
    #     RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
    #   shell:
    #   run: echo "SUFFIX=${{ env.RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"
    - uses: ./.github/workflows/build-pk3
      env:
        name: ${{ inputs.name }}
        suffix: ${{ env.RELEASE_VERSION }}

    # Create Release
    - uses: softprops/action-gh-release@v0.1.15
      env:
        RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        target_commitish: ${{ inputs.target }}
        tag_name: ${{ env.RELEASE_VERSION }}
        name: ${{ env.RELEASE_VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: ./*.pk3
