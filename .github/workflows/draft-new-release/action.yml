name: Draft New Release
description: Creates a new Release Branch, updates the CHANGELOG.md, commits, and creates a PR for review.

inputs:
  version:
    description: The version you want to release.
    required: true
    type: string
  base:
    description: The branch/tag/commit to make the Release Branch off of.  Defaults to 'main'
    required: false
    type: string
    default: main

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Create release branch
      shell:
      run: git checkout -b release/${{ github.event.inputs.version }}

    - name: Update Changelog
      uses: thomaseizinger/keep-a-changelog-new-release@1.1.0
      with:
        version: ${{ inputs.version }}

    - name: Initialize mandatory git config
      shell:
      run: |
        git config user.name "Github Actions"
        git config user.email "noreply@github.com"

    - name: Commit Changelog
      id: make-commit
      shell:
      run: |
        git add CHANGELOG.md
        git commit --message "Prepare release ${{ inputs.version }}"

        echo "::set-output name=commit::$(git rev-parse HEAD)"

    - name: Push New Branch
      shell:
      run: git push origin release/${{ inputs.version }}

    - name: Create Pull Request
      uses: thomaseizinger/create-pull-request@1.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        head: release/${{ inputs.version }}
        base: ${{ inputs.base }}
        title: Release ${{ inputs.version }}
        reviewers: ${{ github.actor }}
        body: |
          Hi @${{ github.actor }}!

          This PR was created in response to a manual trigger of the release workflow here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
          I've updated the changelog file in this commit: ${{ steps.make-commit.outputs.commit }}.

          Merging this PR will create a GitHub release with the new PK3.
